<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhema Bible</title>
<meta name="description" content="Bible français et anglais avec grec, hébreu et dictionnaire Strong">
<meta name="theme-color" content="#2B2F8F">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rhema">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
html{background:#F5F6FB}
@media (prefers-color-scheme:dark){html{background:#0E1024}}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{touch-action:manipulation}

.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--gold-bg);border-radius:16px;padding:10px 12px;margin:4px 0 8px}
.banner .lbl{flex:1;min-width:140px;font-size:14px;line-height:1.3}
.banner .lbl b{color:var(--gold)}
.banner button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.banner button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:8px;border-radius:4px;background:var(--accent)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.days button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.days button.done{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.days button.cur{outline:2px solid var(--gold);outline-offset:1px}
.v.speaking{background:var(--sel)}
.v.speaking .n{color:var(--gold)}
.chap-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chap-chips .tag{font-size:14px;padding:6px 12px;border-radius:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.player .bar span.lab{padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap}
nav.tabs button{font-size:10.5px;padding:0 2px;min-width:0}

.homehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.homehead h1{margin:0;font-size:28px;letter-spacing:-.02em}
.homehead .muted{font-size:14px;display:inline-block}.homehead .muted::first-letter{text-transform:uppercase}
.streak{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:22px;display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--fg)}
.streak svg{width:20px;height:20px;fill:var(--gold-bg);stroke:var(--gold);stroke-width:1.8;stroke-linejoin:round}
.searchbar{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:0 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;text-align:left}
.searchbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;flex:none}
.vod{margin:14px 0;padding:22px 20px 16px;border-radius:26px;color:#fff;background:linear-gradient(150deg,#3A3FB0 0%,#2B2F8F 45%,#171A5C 100%);position:relative;overflow:hidden}
.vod::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(217,162,27,.35),rgba(217,162,27,0) 70%);pointer-events:none}
.vod-lab{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#E9C46A}
.vod-ref{display:block;margin-top:4px;font-size:17px}
.vod-t{margin:16px 0 0;font-family:var(--font-text);font-size:calc(var(--fs) + 3px);line-height:1.5}
.vod-t2{margin:10px 0 0;font-family:var(--font-text);font-style:italic;font-size:calc(var(--fs) - 1px);line-height:1.45;color:#D5D8FF}
.vod-act{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.vod-act button{min-height:44px;padding:0 14px;border:0;border-radius:22px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.vod-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vod-foot{display:block;margin-top:12px;font-size:12px;color:#C3C7F5}
.rowcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin:10px 0 0;padding:14px;color:var(--fg)}
.rowcard .ricon{width:48px;height:48px;border-radius:14px;background:var(--sel);display:flex;align-items:center;justify-content:center;flex:none}
.rowcard .ricon svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rowcard .rtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowcard .rtext b{font-size:16px}.rsmall{font-size:13px}
.chev{font-size:26px;color:var(--muted);flex:none}
.badgestrip{width:100%;display:flex;align-items:center;gap:6px;padding:12px 14px;color:var(--fg)}
.badgestrip .chev{margin-left:auto}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.stat b{font-size:30px;line-height:1.1;letter-spacing:-.02em}.stat b small{font-size:14px;font-weight:500;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.mdl{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.mdl b{font-size:13px;line-height:1.25}
.mdl.locked .medal{opacity:.9}
.track.sm{height:5px;width:80%;margin-top:4px}.mdl .pr{font-size:11px}
.absent{color:var(--muted);font-style:italic;font-size:.82em;font-family:var(--font-ui)}.vwarn{margin:0 0 8px;padding:8px 12px;border-left:3px solid var(--gold);background:var(--gold-bg);color:var(--fg);border-radius:0 10px 10px 0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: phone-first app column (max 560px) with fixed bottom navigation; reader, search, Strong, versions, saved. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --surface2:#ECEEF8; --line:#DADDEC;
  --fg:#14173A; --muted:#575C7C; --accent:#2B2F8F; --on-accent:#FFFFFF;
  --gold:#8A5A00; --gold-bg:#FFF1CC; --hl:#FFE49A; --sel:#E4E6FF; --ok:#1B6B4A;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-text:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-heb:'Noto Serif Hebrew','Source Serif 4',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1024; --surface:#171A3A; --surface2:#20244D; --line:#2C3162;
  --fg:#EDEEFA; --muted:#A5A9CF; --accent:#AEB2FF; --on-accent:#0E1024;
  --gold:#F2C14E; --gold-bg:#3A2D0A; --hl:#6B5413; --sel:#262B63; --ok:#7BD6A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1024; --surface:#171A3A; --surface2:#20244D; --line:#2C3162;
  --fg:#EDEEFA; --muted:#A5A9CF; --accent:#AEB2FF; --on-accent:#0E1024;
  --gold:#F2C14E; --gold-bg:#3A2D0A; --hl:#6B5413; --sel:#262B63; --ok:#7BD6A8; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{width:40px;height:40px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.grow{flex:1}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:22px;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip small{font-weight:500;color:var(--muted)}
.chip.on small{color:inherit;opacity:.85}
h2{font-size:22px;letter-spacing:-.01em;margin:18px 0 8px;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
/* reader */
.chap-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 4px}
.chap-title h1{font-family:var(--font-text);font-size:30px;margin:0;font-weight:600;letter-spacing:-.01em}
.text{font-family:var(--font-text);font-size:var(--fs,19px);line-height:1.65}
.v{display:flex;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer}
.v:hover{background:var(--surface2)}
.v.sel{background:var(--sel)}
.v .n{font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--accent);width:20px;flex:none;padding-top:.55em;text-align:right}
.v .t{flex:1;min-width:0}
.v .t p{margin:0}
.v .t p.second{font-size:.92em;font-style:italic;color:var(--accent);margin-top:4px}
.v.hl .t p:first-child{background:var(--hl);border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.v .fav{color:var(--gold);font-size:13px}
.v .notebox{margin-top:6px;padding:8px 10px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 10px 10px 0;font-family:var(--font-ui);font-size:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.v .notebox b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.notearea{width:100%;min-height:140px;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;background:var(--surface);color:var(--fg);resize:vertical}
.pager{display:flex;gap:10px;margin:20px 0}
.pager button{flex:1;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:24px;font-weight:600}
.actions{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:6;pointer-events:none;padding:0 max(16px,env(safe-area-inset-left,0px))}
.actions .bar{pointer-events:auto;background:#14173A;color:#fff;border-radius:28px;padding:5px;display:flex;gap:2px;box-shadow:0 8px 24px rgba(10,12,40,.35);max-width:100%;overflow-x:auto}
.actions button{min-width:56px;min-height:48px;border:0;border-radius:24px;background:transparent;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;gap:0;padding:2px 8px}
.actions button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actions button:hover{background:rgba(255,255,255,.14)}
.actions .orig{background:#F2C14E;color:#14173A}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:7;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav.tabs button{flex:1;min-height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:14px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* cards, lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.row.sel{border-color:var(--accent);background:var(--sel)}
.badge{width:52px;height:44px;flex:none;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-family:var(--font-text);font-weight:700;font-size:13px;text-align:center;line-height:1.05}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.tag.free{background:var(--gold-bg);color:var(--gold)}
.input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:0 18px;font-size:16px}
.res{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;display:block;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.res b{color:var(--accent);font-size:14px}
.res p{margin:2px 0 0;font-family:var(--font-text);font-size:16px;line-height:1.5}
mark{background:var(--hl);color:inherit;border-radius:3px}
/* strong */
.strong-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lemma{font-family:var(--font-text);font-size:40px;line-height:1.1;font-weight:600}
.lemma.heb{font-family:var(--font-heb);direction:rtl}
.code{padding:4px 12px;border-radius:14px;background:var(--gold-bg);color:var(--gold);font-weight:700;font-size:14px;white-space:nowrap}
dl{margin:12px 0 0;display:grid;gap:10px}
dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dd{margin:2px 0 0}
a.code-link,button.code-link{color:var(--accent);font-weight:600;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-size:inherit}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet h3{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600}
.grid button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.books button{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 12px;text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.books button.on{border-color:var(--accent);background:var(--sel);font-weight:700}
.orig-text{font-family:var(--font-text);font-size:24px;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 12px}
.orig-text.heb{direction:rtl;font-family:var(--font-heb);font-size:26px}
.orig-text button{border:0;background:transparent;border-bottom:2px dotted var(--gold);padding:0 2px;min-height:40px;font:inherit;color:var(--fg)}
.orig-text button.on{background:var(--hl);border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#14173A;color:#fff;padding:10px 18px;border-radius:20px;z-index:30;font-size:14px;font-weight:600}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;padding:16px 0 4px}
.hero .logo{width:72px;height:72px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.note{font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="logo" viewBox="0 0 64 64">
<rect width="64" height="64" rx="15" fill="#2B2F8F"/>
<rect x="17" y="10" width="31" height="44" rx="3.5" fill="#FFFFFF"/>
<path d="M17 13.5a3.5 3.5 0 0 1 3.5-3.5H24v44h-3.5a3.5 3.5 0 0 1-3.5-3.5z" fill="#C9CCFF"/>
<rect x="34" y="18" width="3.4" height="19" rx="1" fill="#D9A21B"/>
<rect x="28.2" y="23" width="15" height="3.4" rx="1" fill="#D9A21B"/>
<rect x="29" y="43" width="14" height="2" rx="1" fill="#C9CCFF"/>
</symbol>
</svg>

<div class="app">
<header class="top">
  <svg class="logo" role="img" aria-label="Logo Rhema Bible"><use href="#logo"/></svg>
  <div class="brand"><b>Rhema Bible</b><span>FR · EN · Grec · Hébreu</span></div>
  <div class="grow"></div>
  <button class="iconbtn" id="btn-theme" aria-label="Changer le thème"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
  <button class="iconbtn" id="btn-search" aria-label="Rechercher"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="iconbtn" id="btn-size" aria-label="Taille du texte"><svg viewBox="0 0 24 24"><path d="M3 19L8 6l5 13M5 15h6M15 19l3-7 3 7M16 17h4"/></svg></button>
</header>
<main id="view"></main>
</div>

<div class="actions" id="actions" hidden><div class="bar" role="toolbar" aria-label="Actions sur le verset"></div></div>

<div class="actions player" id="player" hidden><div class="bar" role="toolbar" aria-label="Lecteur audio"></div></div>

<nav class="tabs" aria-label="Navigation principale"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<div id="toast-host"></div>

<script>
(function(){
'use strict';

async function supaFetch(path,o={},bearer){
  const h={apikey:SUPA.key,'Content-Type':'application/json',...(o.headers||{})};
  if(bearer)h.Authorization='Bearer '+bearer;
  const r=await fetch(SUPA.url+path,{...o,headers:h});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&(j.msg||j.error_description||j.message||j.error))||('Erreur '+r.status));
  return j;
}
function supaSave(j){SUPA.sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id,email:j.user&&j.user.email};store.set('supasess',SUPA.sess)}
async function supaToken(){
  const s=SUPA.sess;if(!s)throw new Error('Non connecté');
  if(s.exp-Date.now()>60000)return s.at;
  try{const j=await supaFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.rt})});supaSave(j);return SUPA.sess.at}
  catch(e){supaOut();throw e}
}
function supaOut(){SUPA.sess=null;store.set('supasess',null);if(SY.adapter&&SY.adapter.supa)SY.adapter=null}
function supaAdapter(){
  return{supa:true,label:SUPA.sess.email||'ton compte Rhema',
    async pull(){const t=await supaToken();const r=await supaFetch('/rest/v1/rhema_sync?select=doc&limit=1',{},t);return r&&r[0]?r[0].doc:null},
    async push(d){const t=await supaToken();await supaFetch('/rest/v1/rhema_sync?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:SUPA.sess.uid,doc:d,updated_at:new Date().toISOString()})},t)}};
}
async function supaAuth(mode,email,pw){
  const j=mode==='up'?await supaFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:pw})}):await supaFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pw})});
  if(!j.access_token)return false;
  supaSave(j);SY.adapter=supaAdapter();return true;
}

const SY={st:store.get('sync',{items:{}}),adapter:null,busy:false,last:store.get('synclast',null),err:'',timer:null};
function syItems(){const o={};S.favs.forEach(k=>o['f:'+k]=true);S.hls.forEach(k=>o['h:'+k]=true);Object.keys(S.notes).forEach(k=>o['n:'+k]=S.notes[k]);Object.keys(S.plans).forEach(id=>o['p:'+id]=S.plans[id]);S.days.forEach(d=>o['d:'+d]=true);S.read.forEach(k=>o['r:'+k]=true);return o}
function syCommit(){
  const cur=syItems(),it=SY.st.items,now=Date.now();let ch=false;
  for(const id of new Set([...Object.keys(cur),...Object.keys(it)])){
    const e=it[id],has=cur[id]!==undefined;
    if(has){if(!e||e.v===null||JSON.stringify(e.v)!==JSON.stringify(cur[id])){it[id]={v:cur[id],t:now};ch=true}}
    else if(e&&e.v!==null){it[id]={v:null,t:now};ch=true}
  }
  if(ch)store.set('sync',SY.st);return ch;
}
function syApply(){
  const it=SY.st.items;S.favs=[];S.hls=[];S.notes={};S.plans={};S.days=[];S.read=[];
  for(const id in it){const v=it[id].v;if(v===null||v===undefined)continue;const t=id[0],k=id.slice(2);if(t==='f')S.favs.push(k);else if(t==='h')S.hls.push(k);else if(t==='n')S.notes[k]=v;else if(t==='p')S.plans[k]=v;else if(t==='d')S.days.push(k);else if(t==='r')S.read.push(k)}
  ['favs','hls','notes','plans','days','read'].forEach(k=>store.set(k,S[k]));
}
function syMerge(remote){
  let ch=false;const it=SY.st.items,ri=(remote&&remote.items)||{};
  for(const id in ri){const r=ri[id];if(!r||typeof r.t!=='number'||!/^[fhnpdr]:/.test(id))continue;if(!it[id]||r.t>it[id].t){it[id]={v:r.v===undefined?null:r.v,t:r.t};ch=true}}
  if(ch){syApply();store.set('sync',SY.st)}return ch;
}
async function syInit(){
  try{
    if((!window.claude||!claude.use)&&typeof SUPA!=='undefined'){if(SUPA.sess){SY.adapter=supaAdapter();syNow(true)}return}
    if(!window.claude||!claude.use)return;
    const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.collection('data/users/'+id).doc('rhema');
    SY.adapter={label:'ton compte Claude',async pull(){const s=await ref.get();return s.exists?s.data():null},async push(d){await ref.set(d)}};
    syNow(true);
  }catch(e){}
}
async function syNow(silent){
  if(!SY.adapter||SY.busy)return;SY.busy=true;SY.err='';
  try{
    syCommit();
    const remote=await SY.adapter.pull();
    const ch=syMerge(remote);
    await SY.adapter.push({v:1,items:SY.st.items,t:Date.now()});
    SY.last=Date.now();store.set('synclast',SY.last);
    if(ch){render();if(!silent)toast('Synchronisé : données mises à jour')}else if(!silent)toast('Synchronisé');
  }catch(e){SY.err='La synchronisation a échoué. Réessaie plus tard.';if(!silent)toast('Synchronisation impossible')}
  SY.busy=false;if(S.tab==='me')render();
}
function syLater(){if(!SY.adapter)return;clearTimeout(SY.timer);SY.timer=setTimeout(()=>syNow(true),1500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syNow(true)});

function load(name){
  if(cache[name])return Promise.resolve(cache[name]);
  if(pending[name])return pending[name];
  return pending[name]=fetch(name+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{if(/^bible-(mar|jnd)$/.test(name))d.forEach(b=>b.forEach(c=>{for(let i=0;i<c.length;i++)if(c[i]==='↑')c[i]='↑ Inclus dans le verset précédent.'}));cache[name]=d;delete pending[name];return d});

/* ---------- texte original + Strong ---------- */
const stripGreek=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/[^\p{L}]|[ʼ]/gu,'');
const stripHeb=s=>s.replace(/[֑-ׇ]/g,'').replace(/[׃־]/g,'');
let greekIdx=null,hebIdx=null;
function buildIdx(kind,dict){
  const m=new Map();
  for(const k in dict){const lem=dict[k][0];if(!lem)continue;const s=kind==='G'?stripGreek(lem):stripHeb(lem);if(!m.has(s))m.set(s,[]);m.get(s).push(k)}
  return m;
}
async function guessStrong(word,isNT){
  const dict=await load(isNT?'strongs-greek':'strongs-hebrew');
  let idx=isNT?(greekIdx=greekIdx||buildIdx('G',dict)):(hebIdx=hebIdx||buildIdx('H',dict));
  if(isNT){
    const w=stripGreek(word);
    if(idx.has(w))return idx.get(w).slice(0,4);
    const out=[];
    for(let cut=0;cut<=3&&!out.length;cut++){
      const stem=w.slice(0,w.length-cut);if(stem.length<3)break;
      for(const [lem,codes] of idx){ if(lem.length>=3&&(lem.startsWith(stem)||(cut>0&&stem.startsWith(lem.slice(0,Math.max(3,lem.length-2)))&&Math.abs(lem.length-stem.length)<=3))){out.push(...codes);if(out.length>=6)break} }
    }
    return out.slice(0,6);
  }
  let w=stripHeb(word);
  const tries=[w];for(let i=1;i<=2;i++){if('והבלמכש'.includes(w[0]||'')&&w.length>2){w=w.slice(1);tries.push(w)}}
  for(const t of tries){if(idx.has(t))return idx.get(t).slice(0,4)}
  return [];
}
async function showOriginal(b,c,v){
  const isNT=b>=39;
  openSheet('Texte original · '+refStr(b,c,v),'<div class="loading">Chargement…</div>',async root=>{
    let d;try{d=await load(isNT?'bible-grc':'bible-wlc')}catch(e){root.innerHTML='<div class="card">Texte original indisponible.</div>';return}
    let refs=[[c,v]];{let om;try{om=await load('orig-map')}catch(e){om={}}const m=(om[b]||{})[c+'.'+v];if(m===0)refs=[];else if(m)refs=Array.isArray(m[0])?m:[m]}
    const raw=refs.map(r=>(d[b][r[0]-1]||[])[r[1]-1]||'').filter(Boolean).join(' ');
    if(!raw){root.innerHTML='<div class="card">Ce verset n’est pas dans le texte '+(isNT?'grec (SR)':'hébreu (WLC)')+'.</div>';return}
    const words=raw.split(/\s+/).filter(Boolean);
    root.innerHTML='<p class="eyebrow">'+(isNT?'Grec · Statistical Restoration GNT':'Hébreu · Westminster Leningrad Codex')+'</p><div class="orig-text'+(isNT?'':' heb')+'" lang="'+(isNT?'grc':'he')+'">'+words.map((w,i)=>'<button data-i="'+i+'">'+esc(w)+'</button>').join('')+'</div><p class="note">Touche un mot pour voir les entrées Strong probables. Le rapprochement se fait par la forme du mot et peut être approximatif.</p><div id="guess" style="margin-top:12px"></div>';
    root.querySelector('.orig-text').addEventListener('click',async e=>{
      const btn=e.target.closest('button');if(!btn)return;

      const codes=await guessStrong(words[+btn.dataset.i],isNT);
      const dict=cache[isNT?'strongs-greek':'strongs-hebrew'];
      const g=$('#guess',root);

      g.innerHTML='<div class="list">'+codes.map(k=>{const e=dict[k];return '<button class="row" data-code="'+k+'"><span class="code">'+k+'</span><span style="flex:1;min-width:0"><b class="'+(isNT?'':'heb')+'" style="font-family:'+(isNT?'var(--font-text)':'var(--font-heb)')+';font-size:20px">'+esc(e[0])+'</b> <span class="muted">'+esc(e[1])+'</span><br><span style="font-size:14px">'+esc(e[6]||e[4]||e[3]).slice(0,110)+'</span></span></button>'}).join('')+'</div>';
    });
    root.addEventListener('click',e=>{const r=e.target.closest('[data-code]');if(r){closeOverlay();S.strongKind=r.dataset.code[0];S.strongQ=r.dataset.code;S.tab='strong';renderTabs();render();window.scrollTo(0,0)}});

function strongCard(code,e,kind){
  const heb=kind==='H',fr=S.slang==='fr'&&e[6];
  const rel=[...new Set((e[5]||'').match(/[GH]\d{1,4}/g)||[])].filter(c=>c!==code);
  let body;
  if(fr){

function runStrong(){
  const kind=S.strongKind,dict=cache[kind==='G'?'strongs-greek':'strongs-hebrew'],q=(S.strongQ||'').trim(),out=$('#sres');
  if(!dict)return;
  let codes=[],note='';
  if(!q){codes=['3056','4487','4151','26','5485','3341'].map(n=>kind+n).filter(c=>dict[c]);if(kind==='H')codes=['H7307','H430','H3068','H2617','H7965','H1697'].filter(c=>dict[c]);note='Entrées souvent consultées'}
  else{
    const m=q.match(/^([GHgh])?\s*0*(\d{1,4})$/);
    if(m){const L=m[1]?m[1].toUpperCase():kind;if(L!==kind){S.strongKind=L;S.strongQ=L+m[2];viewStrong();return}const c=L+m[2];if(dict[c]){codes=[c];if(!S.cnt.strong.includes(c)){S.cnt.strong.push(c);save()}}else note='Aucune entrée '+c}
    else{
      const nq=norm(q),nqt=nq.replace(/[wʼʻ']/g,''),gq=kind==='G'?stripGreek(q):stripHeb(q);
      const scored=[];
      for(const k in dict){const e=dict[k];if(k[0]!==kind)continue;
        let s=0;const lem=kind==='G'?stripGreek(e[0]):stripHeb(e[0]);
        if(lem===gq)s=100;else if(lem.startsWith(gq)&&gq.length>1)s=60;
        const tr=norm(e[1]).replace(/[wʼʻ']/g,'');if(tr===nqt)s=Math.max(s,95);else if(tr.startsWith(nqt))s=Math.max(s,55);
        const kj=(e[4]||'').toLowerCase().split(/[,;()\s]+/);if(kj.includes(q.toLowerCase()))s=Math.max(s,50);
        const frw=norm(e[7]||'').split(/[,;()\s.\[\]]+/);if(nq.length>1&&frw.includes(nq)){const inSens=norm(e[6]||'').split(/[^a-z']+/).includes(nq);s=Math.max(s,inSens?64:52)}
        if(!s&&(e[3]||'').toLowerCase().includes(q.toLowerCase()))s=20;
        if(!s&&e[6]&&nq.length>2&&norm(e[6]).includes(nq))s=25;
        if(s)scored.push([s,k])}
      scored.sort((a,b)=>b[0]-a[0]||(+a[1].slice(1))-(+b[1].slice(1)));
      codes=scored.slice(0,25).map(x=>x[1]);note=scored.length+' résultat'+(scored.length>1?'s':'')+(scored.length>25?' (25 affichés)':'');
      if(!scored.length&&/[a-zéèêàçùôî]/i.test(q)&&!/^[a-z]+$/i.test(q))note='Aucun résultat. Essaie la translittération (logos, ruach), un mot français ou un mot anglais.';
      else if(!scored.length)note='Aucun résultat. Essaie la translittération (logos, ruach), un mot français ou un mot anglais.';
    }
  }
  out.innerHTML=(note?'<p class="muted" style="margin:0 0 10px">'+esc(note)+'</p>':'')+codes.map(c=>strongCard(c,dict[c],kind)).join('');
}

function parseRef(q){
  const m=norm(q).match(/^([123]?\s?[a-z' ]+?)\s+(\d{1,3})(?:\s*[:.,]\s*(\d{1,3}))?$/);
  if(!m)return null;
  const name=m[1].replace(/\s+/g,' ').trim();if(name.length<2)return null;
  const find=list=>list.findIndex(b=>{const n=norm(b);return n===name||n.startsWith(name)});
  let i=find(BOOKS_FR);if(i<0)i=find(BOOKS_EN);if(i<0)return null;
  return {b:i,c:+m[2],v:m[3]?+m[3]:null};
}

async function runSearch(){
  const out=$('#sr'),q=S.searchQ;if(!q){out.innerHTML='';return}

  out.innerHTML='<div class="loading">Recherche…</div>';
  let data;try{data=await load('bible-'+S.v1)}catch(e){out.innerHTML='<div class="card">Version indisponible.</div>';return}

  const nq=norm(q),terms=nq.split(/\s+/).filter(Boolean);
  const res=[];let total=0;const lang=uiLang();
  for(let b=0;b<66;b++){const bk=data[b];for(let c=0;c<bk.length;c++){const vs=bk[c];for(let v=0;v<vs.length;v++){const t=vs[v];if(!t)continue;const nt=norm(t);let ok=true;for(const w of terms){if(!nt.includes(w)){ok=false;break}}if(ok){total++;if(res.length<80)res.push([b,c+1,v+1,t])}}}}
  const hi=t=>{let h=esc(t);terms.forEach(w=>{const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');});return h};
  function mark(t){
    const nt=norm(t);const spans=[];
    terms.forEach(w=>{let i=0;while((i=nt.indexOf(w,i))>=0){spans.push([i,i+w.length]);i+=w.length}});

    return o+esc(t.slice(p));
  }

/* ---------- rappel quotidien (appli installée, Capacitor) ---------- */
const LN=()=>{try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications||null}catch(e){return null}};
S.notif=Object.assign({on:false,time:'08:00'},store.get('notif',{}));
async function notifSync(askPerm){
  const ln=LN();if(!ln)return false;
  try{
    const pend=await ln.getPending();
    if(pend&&pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!S.notif.on)return true;
    let perm=await ln.checkPermissions();
    if(perm.display!=='granted'){if(!askPerm)return false;perm=await ln.requestPermissions();if(perm.display!=='granted')return false}
    const data=await load('bible-'+S.v1),tm=(S.notif.time||'08:00').split(':').map(Number),now=new Date(),list=[];
    for(let i=0;i<31;i++){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,tm[0]||0,tm[1]||0,0);
      if(d<=now)continue;
      const v=vodAt(d),sp=specialDay(d);
      list.push({id:1000+i,title:(sp?sp.label:'Verset du jour')+' · '+refStr(v[0],v[1],v[2]),body:data[v[0]][v[1]-1][v[2]-1],schedule:{at:d,allowWhileIdle:true}});
    }
    if(list.length)await ln.schedule({notifications:list});
    return true;
  }catch(e){return false}
}
function notifCard(){
  if(!LN())return '<h2 style="margin:22px 0 8px">Rappel quotidien</h2><div class="card"><p style="margin:0"><b>Verset du jour par notification</b></p><p class="note" style="margin:6px 0 0">Disponible dans l’application installée (Android et iPhone). Choisis l’heure et reçois chaque jour le verset du jour, et un verset spécial à Noël, Pâques, l’Ascension, la Pentecôte et le Nouvel An.</p></div>';
  return '<h2 style="margin:22px 0 8px">Rappel quotidien</h2><div class="card"><label style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px"><span><b>Recevoir le verset du jour</b><br><span class="muted" style="font-size:13px">Une notification par jour avec le verset</span></span><input type="checkbox" id="nt-on" style="width:26px;height:26px;accent-color:var(--accent)"'+(S.notif.on?' checked':'')+'></label><label style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;min-height:44px"><span><b>Heure</b></span><input type="time" id="nt-time" value="'+esc(S.notif.time)+'" class="notearea" style="width:auto;min-height:0;height:44px;padding:0 12px"></label><p class="note" id="nt-msg" aria-live="polite" style="margin:8px 0 0">Tu peux choisir minuit (00:00) si tu veux le verset dès le début de la journée.</p></div>';

 {id:'gospels',n:'Les Évangiles en 30 jours',d:'Matthieu, Marc, Luc et Jean',days:30,books:rng(39,43)},
 {id:'nt90',n:'Le Nouveau Testament en 90 jours',d:'Environ trois chapitres par jour',days:90,books:rng(39,66)},

const planOf=id=>PLANS.find(p=>p.id===id);
function planChapters(p){
  const data=cache['bible-'+S.v1];const all=[];
  p.books.forEach(b=>{for(let c=1;c<=data[b].length;c++)all.push([b,c])});
  const days=[];
  for(let d=0;d<p.days;d++){days.push(all.slice(Math.floor(d*all.length/p.days),Math.floor((d+1)*all.length/p.days)))}
  return {all,days};
}
const planState=id=>S.plans[id]||(S.plans[id]={done:[]});
const nextDay=(p,st)=>{for(let d=0;d<p.days;d++)if(!st.done.includes(d))return d;return -1};
const refList=(list,lang)=>list.map(([b,c])=>bookName(b,lang)+' '+c);

    });

function clearSpeaking(){document.querySelectorAll('.v.speaking').forEach(x=>x.classList.remove('speaking'))}

function speakFrom(n){
  if(!canSpeak()){toast('Audio indisponible sur cet appareil');return}
  if(!cache['bible-'+S.v1])return;
  AUDIO.tok++;AUDIO.on=true;AUDIO.paused=false;AUDIO.b=S.book;AUDIO.c=S.ch;AUDIO.i=n;
  try{aud.pause()}catch(e){}
  S.sel=null;hideActions();
  try{speechSynthesis.cancel()}catch(e){}
  renderPlayer();
  if(n<=1&&fileUrl(S.v1,AUDIO.b,AUDIO.c))startFile();else{AUDIO.mode='tts';speakNext()}
}
async function speakNext(){
  if(!AUDIO.on||AUDIO.paused)return;
  const tok=AUDIO.tok,data=cache['bible-'+S.v1];
  if(!data){stopAudio();return}
  let vs=data[AUDIO.b][AUDIO.c-1]||[];
  if(AUDIO.i>vs.length){
    let b=AUDIO.b,c=AUDIO.c+1;if(c>data[b].length){b=(b+1)%66;c=1}
    AUDIO.b=b;AUDIO.c=c;AUDIO.i=1;S.book=b;S.ch=c;S.sel=null;
    if(S.plan){const p=planOf(S.plan.id),l=planChapters(p).days[S.plan.day];S.plan.i=Math.max(0,l.findIndex(x=>x[0]===b&&x[1]===c));}
    save();await viewRead();window.scrollTo(0,0);
    if(tok!==AUDIO.tok)return;
    renderPlayer();beginChapter();return;
  }
  const text=vs[AUDIO.i-1];
  if(!text){AUDIO.i++;speakNext();return}
  clearSpeaking();
  const el=$('.v[data-v="'+AUDIO.i+'"]');
  if(el&&AUDIO.b===S.book&&AUDIO.c===S.ch){el.classList.add('speaking');el.scrollIntoView({block:'center',behavior:'smooth'})}
  renderPlayer();
  const lang=uiLang(),chunks=speechChunks(text,lang);let ci=0;
  const step=()=>{
    if(tok!==AUDIO.tok||!AUDIO.on||AUDIO.paused)return;
    if(ci>=chunks.length){clearTimeout(AUDIO.timer);AUDIO.timer=setTimeout(()=>{if(tok!==AUDIO.tok||!AUDIO.on||AUDIO.paused)return;AUDIO.i++;speakNext()},240);return}
    const u=makeUtt(chunks[ci++],lang);AUDIO.cur=u;
    u.onend=step;
    u.onerror=ev=>{if(tok!==AUDIO.tok)return;if(ev&&(ev.error==='interrupted'||ev.error==='canceled'))return;stopAudio();toast('Lecture audio interrompue')};
    try{speechSynthesis.speak(u)}catch(e){stopAudio();toast('Audio indisponible sur cet appareil')}
  };
  step();
}
function pauseAudio(){if(AUDIO.mode==='file'){try{aud.pause()}catch(e){}AUDIO.paused=true;renderPlayer();return}AUDIO.tok++;AUDIO.paused=true;clearTimeout(AUDIO.timer);try{speechSynthesis.cancel()}catch(e){}renderPlayer()}
function resumeAudio(){if(AUDIO.mode==='file'){AUDIO.paused=false;AUDIO.on=true;try{const pr=aud.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}renderPlayer();return}AUDIO.tok++;AUDIO.paused=false;AUDIO.on=true;renderPlayer();speakNext()}
$('#player').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');if(!b)return;
  if(b.dataset.p==='toggle')AUDIO.paused?resumeAudio():pauseAudio();
  else if(b.dataset.p==='stop')stopAudio();
  else if(b.dataset.p==='voice')voiceSettings();
  else if(b.dataset.p==='rate'){{const ix=RATES.findIndex(r=>r>AUDIO.rate+0.001);AUDIO.rate=ix<0?RATES[0]:RATES[ix];store.set('arate',AUDIO.rate)}if(AUDIO.mode==='file'){aud.playbackRate=AUDIO.rate;renderPlayer();return}if(AUDIO.on&&!AUDIO.paused){AUDIO.tok++;try{speechSynthesis.cancel()}catch(e){}speakNext()}else renderPlayer()}
});


/* qualité de la voix : choix de la meilleure voix disponible, découpage en phrases, réglages */
AUDIO.rate=store.get('arate',1);AUDIO.timer=null;AUDIO.cur=null;
const RATES_FINE=[0.8,0.9,1,1.1,1.25,1.5];
function normLang(v){return String(v.lang||'').toLowerCase().replace('_','-')}
function voiceBonus(v){
  const n=v.name||'';let b=0;
  if(/premium|enhanced|am[ée]lior|neural|natural|online|wavenet|studio|siri/i.test(n))b+=40;
  else if(/google/i.test(n))b+=25;
  if(/compact|espeak|eloquence|novelty/i.test(n))b-=40;
  if(v.localService===false)b+=5;
  return b;
}
function voiceTag(v){const b=voiceBonus(v);return b>=40?'haute qualité':b>=20?'bonne qualité':b<0?'basique':'standard'}
function voicesFor(lang){
  let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
  const want=lang==='fr'?'fr':'en';
  return vs.filter(v=>normLang(v).startsWith(want)).map(v=>{
    const l=normLang(v);let s=voiceBonus(v);
    if(lang==='fr')s+=l==='fr-fr'?50:l==='fr'?40:30;else s+=(l==='en-us'||l==='en-gb')?50:30;
    if(v.default)s+=2;
    return {v,s};
  }).sort((a,b)=>b.s-a.s).map(x=>x.v);
}
function pickVoice(lang){
  const list=voicesFor(lang),want=(store.get('avoice',{})||{})[lang];
  return (want&&list.find(v=>v.name===want))||list[0]||null;
}
function cleanForSpeech(t,lang){
  let s=String(t).replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/- (?=[A-ZÉ])/g,'-').trim();
  if(lang==='fr'){
    s=s.replace(/\bEternel\b/g,'Éternel').replace(/\bEglise(s?)\b/g,'Église$1').replace(/\bEvangile(s?)\b/g,'Évangile$1').replace(/\bEcriture(s?)\b/g,'Écriture$1').replace(/\bEsa[iï]e\b/g,'Ésaïe').replace(/\bEgypte\b/g,'Égypte').replace(/\bEsprit\b/g,'Esprit');
  }
  return s;
}
function speechChunks(text,lang){
  const s=cleanForSpeech(text,lang);
  const parts=s.match(/[^.;:!?…]+[.;:!?…]*\s*/g)||[s];
  const out=[];
  parts.forEach(p=>{
    p=p.trim();if(!p)return;
    if(p.length<=170){out.push(p);return}
    let cur='';
    p.split(/(?<=,)\s+/).forEach(w=>{if((cur+' '+w).trim().length>150&&cur){out.push(cur.trim());cur=w}else cur=(cur+' '+w).trim()});
    if(cur)out.push(cur.trim());
  });
  // fusionne les très courts morceaux avec le suivant pour une diction plus fluide
  const m=[];out.forEach(c=>{if(m.length&&m[m.length-1].length<18)m[m.length-1]+=' '+c;else m.push(c)});
  return m.length?m:[s];
}
function makeUtt(txt,lang){
  const u=new SpeechSynthesisUtterance(txt);
  const v=pickVoice(lang);
  u.lang=v?v.lang:(lang==='fr'?'fr-FR':'en-US');if(v)u.voice=v;
  u.rate=AUDIO.rate;u.pitch=1;u.volume=1;
  return u;
}
function voiceSettings(){
  const lang=uiLang();
  const list=voicesFor(lang),cur=pickVoice(lang);
  const rate=AUDIO.rate;
  let body='<label class="muted" style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase" for="vs-voice">Voix ('+(lang==='fr'?'français':'anglais')+')</label>';
  if(list.length)body+='<select id="vs-voice" class="notearea" style="min-height:0;height:52px;margin-top:6px">'+list.map(v=>'<option value="'+esc(v.name)+'"'+(cur&&cur.name===v.name?' selected':'')+'>'+esc(v.name)+' — '+voiceTag(v)+'</option>').join('')+'</select>';
  else body+='<p class="note">Aucune voix de ce type trouvée sur cet appareil. Installe une voix dans les réglages du téléphone (voir les conseils ci-dessous).</p>';
  body+='<label class="muted" style="display:block;margin-top:16px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase" for="vs-rate">Vitesse : <span id="vs-rv">×'+rate+'</span></label><input id="vs-rate" type="range" min="0.7" max="1.5" step="0.05" value="'+rate+'" style="width:100%;margin-top:6px;accent-color:var(--accent)">';
  body+='<button class="chip" id="vs-test" style="margin-top:14px;min-height:48px;background:var(--accent);color:#fff;border-color:transparent;font-weight:600">Écouter un extrait</button>';
  body+='<div class="card" style="margin-top:16px"><b>Améliorer la qualité</b><p class="note" style="margin:6px 0 0">La qualité dépend des voix installées sur ton téléphone. Les voix « haute qualité » sont bien plus naturelles.</p><p class="note" style="margin:8px 0 0"><b>iPhone :</b> Réglages › Accessibilité › Contenu énoncé › Voix › Français, puis télécharge une voix « Améliorée » ou « Premium » (par exemple Amélie ou Thomas).</p><p class="note" style="margin:8px 0 0"><b>Android :</b> Réglages › Système › Langues › Synthèse vocale › Google Text-to-speech › Installer les données vocales, puis choisis une voix de qualité supérieure.</p><p class="note" style="margin:8px 0 0"><b>Ordinateur :</b> Edge propose des voix « Natural » très réussies ; Chrome et Safari utilisent les voix du système.</p></div>';
  openSheet('Réglages de la voix',body,()=>{
    const sel=$('#vs-voice');
    if(sel)sel.onchange=()=>{const o=store.get('avoice',{})||{};o[lang]=sel.value;store.set('avoice',o)};
    const r=$('#vs-rate');
    r.oninput=()=>{AUDIO.rate=+r.value;$('#vs-rv').textContent='×'+AUDIO.rate;store.set('arate',AUDIO.rate)};
    $('#vs-test').onclick=()=>{
      if(!canSpeak())return;
      try{speechSynthesis.cancel()}catch(e){}
      const tok=++AUDIO.tok;AUDIO.on=false;AUDIO.paused=false;renderPlayer();
      const u=makeUtt(lang==='fr'?'Au commencement était la Parole, et la Parole était avec Dieu.':'In the beginning was the Word, and the Word was with God.',lang);
      AUDIO.cur=u;try{speechSynthesis.speak(u)}catch(e){}
    };
  });
}
try{if('speechSynthesis' in window&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',()=>{})}catch(e){}

/* enregistrements humains (optionnels) : audio/sources.json + fichiers audio/<version>/<BB>_<CCC>.<ext> */
let AUDIO_SRC={};
try{if(FEATURES.audio)fetch('audio/sources.json').then(r=>r.ok?r.json():{}).then(j=>{if(j&&typeof j==='object')AUDIO_SRC=j}).catch(()=>{})}catch(e){}
const aud=new Audio();aud.preload='auto';
function fileUrl(v,b,c){const s=AUDIO_SRC[v];if(!s||typeof s.base!=='string')return null;return s.base+String(b+1).padStart(2,'0')+'_'+String(c).padStart(3,'0')+'.'+(s.ext||'mp3')}
function startFile(){
  const url=fileUrl(S.v1,AUDIO.b,AUDIO.c);
  if(!url){AUDIO.mode='tts';AUDIO.i=1;speakNext();return}
  AUDIO.tok++;const tok=AUDIO.tok;AUDIO.mode='file';
  aud.onended=null;aud.onerror=null;
  aud.src=url;aud.playbackRate=AUDIO.rate;
  const fallback=()=>{if(tok!==AUDIO.tok||AUDIO.mode!=='file')return;toast('Enregistrement absent : voix de synthèse');AUDIO.mode='tts';AUDIO.i=1;speakNext()};
  aud.onended=()=>{if(tok!==AUDIO.tok)return;advanceChapter()};
  aud.onerror=fallback;
  const pr=aud.play();if(pr&&pr.catch)pr.catch(fallback);
  renderPlayer();
}
function beginChapter(){if(fileUrl(S.v1,AUDIO.b,AUDIO.c))startFile();else{AUDIO.mode='tts';AUDIO.i=1;speakNext()}}
async function advanceChapter(){
  const tok=AUDIO.tok,data=cache['bible-'+S.v1];if(!data){stopAudio();return}
  let b=AUDIO.b,c=AUDIO.c+1;if(c>data[b].length){b=(b+1)%66;c=1}
  AUDIO.b=b;AUDIO.c=c;AUDIO.i=1;S.book=b;S.ch=c;S.sel=null;
  if(S.plan){const p=planOf(S.plan.id),l=planChapters(p).days[S.plan.day];S.plan.i=Math.max(0,l.findIndex(x=>x[0]===b&&x[1]===c))}
  save();await viewRead();window.scrollTo(0,0);
  if(tok!==AUDIO.tok)return;
  renderPlayer();beginChapter();
}

function decorateReader(){
  const chips=$('#view .chips');
  if(chips&&FEATURES.audio)chips.insertAdjacentHTML('beforeend','<button class="chip" id="listen" aria-label="Écouter le chapitre">'+ic('headphones')+'<span>Écouter</span></button><button class="chip" id="voice-set" aria-label="Réglages de la voix" style="padding:0 12px">'+ic('sliders')+'</button>');
  const l=$('#listen');
  if(l){const svg=$('svg',l);if(svg){svg.style.width='20px';svg.style.height='20px';svg.style.stroke='currentColor';svg.style.fill='none';svg.style.strokeWidth='1.8'}
    l.onclick=()=>{if(AUDIO.on&&!AUDIO.paused)pauseAudio();else if(AUDIO.paused)resumeAudio();else speakFrom(S.sel||1)}}
  const vsb=$('#voice-set');if(vsb){const sv=$('svg',vsb);if(sv){sv.style.width='20px';sv.style.height='20px';sv.style.stroke='currentColor';sv.style.fill='none';sv.style.strokeWidth='1.8'}vsb.onclick=voiceSettings}
  const bn=planBanner();if(bn){const t=$('#view .chap-title');if(t)t.insertAdjacentHTML('beforebegin',bn);bindBanner()}
  if(AUDIO.on&&AUDIO.b===S.book&&AUDIO.c===S.ch){const el=$('.v[data-v="'+AUDIO.i+'"]');if(el)el.classList.add('speaking')}
}

/* ---------- démarrage ---------- */
renderTabs();render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
armMidnight();checkBadges();syInit();notifSync(false);
})();
